<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#D57E2A]">
  <div class="flex justify-center
  gap-[580px]
  mt-4">
  <div class="flex items-center justify-center gap-[60px]">
  <nav class="text-2xl">Fitness Pro</nav>
  <nav class="flex gap-[40px]">
    <a href="">Home</a>
    <a href="">About Us</a>
    <a href="">Progress</a>
    <a href="">Facilities</a>
    <a href="">Membership</a>
  </nav>
  </div>
  <nav class="flex gap-[30px]">
    <button class="bg-orange-200
    py-2 px-3
    rounded-3xl">Get the App</button>
    <button class="bg-orange-200
    py-2 px-5
    rounded-3xl" id="bookbtn">Book Now</button>
  </nav>
  </div>
  <main class="flex justify-center
  gap-[200px]
  mt-[100px]">
    <div class="ml-10 mt-10">
      <p class="text-7xl">Trasform your<br><i>body and mind</i></p>
      <p class="text-xl
      mt-5
      italic">Build strength, find balance, and unlock your full potential with guided<br>
      fitness and mindful living</p>
          <div class="mt-10 flex gap-5">
            <button class="bg-orange-200
    py-2 px-5
    rounded-3xl">Join Membership</button>
            <button class="bg-orange-300
    py-2 px-5
    rounded-3xl">Start for free</button>
          </div>
    </div>
    <div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10"
      class="rounded-3xl
      hover:scale-[0.85]
      duration-300">
    </div>
      </main>
    <div class="flex justify-center items-center
    fixed
    top-6
    left-0
    w-[100%] h-[100%]
    hidden" id="formbox">
      <div class="bg-orange-200
      w-[500px] flex justify-center
      rounded-3xl
      p-10">
      <form>
      <label for="name">Full Name:</label><br>
      <input type="text" id="text" minlength="5" maxlength="20" required placeholder="Enter your full name">
      <br><br><br>
      <label for="email">Email:</label><br>
      <input type="email" id="email" placeholder="abc@gmail.com" required>
      <br><br><br>
      <label for="pwd">Enter Password:</label><br>
      <input type="password" id="pwd" placeholder="Min 8 charecters" minlength="8" maxlength="15" required>
      <br><br><br>
      <label for="no">Phone Number:</label><br>
      <input type="tel" pattern="(0-9){10}" placeholder="10 digit Mobile Number" required>
      <br><br><br>
      <label for="dob">Date of Birth</label><br>
      <input type="date" id="dob" required>
      <br><br><br>
      <select name="" id="">
        <option>yoga</option>
        <option>yoga</option>
        <option>yoga</option>
        <option>yoga</option>
      </select>
      <br><br><br>
      <button type="submit" class="bg-orange-500
          py-2 px-5
          rounded-3xl">Submit</button>
      <button type="button" class="bg-orange-500
    py-2 px-5
    rounded-3xl" id="closebutton">Close</button>
      </form>
      </div>
    </div>
    <script src="LandingPage.js"></script>
</body>
</html>
